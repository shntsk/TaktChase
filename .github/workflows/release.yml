name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0, without the leading v)'
        type: string
        required: true
      draft:
        description: 'Create draft release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

env:
  GO_VERSION: '1.27.2'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          if [[ -z "$v" ]]; then echo "empty version"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build_windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW (winlibs)
        uses: bwoodsend/setup-winlibs-action@v1

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          version="${{ needs.version.outputs.version }}"
          export TAKTCHASE_BUILD_MODE=0
          ./dist-win.sh "$version"
          test -f "dist/artifacts/taktchase-${version}-win.zip" || { echo "Windows build failed"; exit 1; }

      - name: Verify package contents
        run: |
          python - "dist/artifacts/taktchase-${{ needs.version.outputs.version }}-win.zip" <<'PY'
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          required = ["taktchase.exe", "taktchase-cli.exe", "taktchase-core.dll", "assets.dpak",
                      "bass.dll", "bass_fx.dll", "bassmix.dll", "libyuv.dll", "SDL3.dll"]
          missing = [n for n in required if n not in names]
          if missing:
              print("Missing from Windows package:", missing)
              sys.exit(1)
          print("Windows package OK:", len(names), "files")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: taktchase-win
          path: dist/artifacts/*.zip
          if-no-files-found: error

  build_linux:
    name: Build Arch Linux (x64)
    needs: version
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl unzip \
            libx11 libxrandr libxcursor libxinerama libxi libxext libxxf86vm \
            mesa libglvnd gtk3 alsa-lib

      - uses: actions/checkout@v4

      - name: Install Go
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="${{ needs.version.outputs.version }}"
          ./dist-linux.sh "$version"
          test -f "dist/artifacts/taktchase-${version}-linux.zip" || { echo "Linux build failed"; exit 1; }

      - name: Verify package contents
        run: |
          z="dist/artifacts/taktchase-${{ needs.version.outputs.version }}-linux.zip"
          for f in taktchase taktchase-cli; do
            unzip -Z "$z" "$f" | grep -q '^-rwx' || { echo "Missing or not executable in Linux package: $f"; exit 1; }
          done
          for f in libtaktchase-core.so assets.dpak libbass.so libbass_fx.so libbassmix.so libyuv.so libSDL3.so; do
            unzip -Z1 "$z" | grep -qx "$f" || { echo "Missing from Linux package: $f"; exit 1; }
          done
          echo "Linux package OK"

      - uses: actions/upload-artifact@v4
        with:
          name: taktchase-linux
          path: dist/artifacts/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, build_windows, build_linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: TaktChase ${{ needs.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: artifacts/*.zip
