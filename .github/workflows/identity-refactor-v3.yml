name: One-time TaktChase identity refactor

on:
  push:
    branches:
      - refactor/taktchase-identity
    paths:
      - .github/workflows/identity-refactor-v3.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libgtk-3-dev

      - name: Rename project identifiers and build metadata
        shell: bash
        run: |
          cat > /tmp/refactor_identity.py <<'PY'
          from pathlib import Path
          import re
          import subprocess

          excluded = {
              "README.md",
              "CREDITS.md",
              "LICENSE",
              ".github/workflows/identity-refactor.yml",
              ".github/workflows/identity-refactor-v2.yml",
              ".github/workflows/identity-refactor-v3.yml",
              ".github/workflows/release.yml",
          }
          extensions = {
              ".go", ".c", ".h", ".sh", ".yml", ".yaml", ".json",
              ".toml", ".mod", ".sum", ".md", ".ini", ".cfg", ".bat",
              ".ps1", ".rc",
          }
          extra_names = {".gitignore", ".gitattributes", "Makefile", "Dockerfile"}

          def tracked_paths():
              raw = subprocess.check_output(["git", "ls-files", "-z"])
              return [Path(p) for p in raw.decode().split("\0") if p]

          paths = tracked_paths()
          changed_files = []
          replacements = [
              ("https://github.com/Wieku/danser-go", "https://github.com/shntsk/TaktChase"),
              ("https://github.com/wieku/danser-go", "https://github.com/shntsk/TaktChase"),
              ("http://github.com/Wieku/danser-go", "https://github.com/shntsk/TaktChase"),
              ("github.com/wieku/danser-go", "github.com/shntsk/taktchase"),
              ("github.com/Wieku/danser-go", "github.com/shntsk/taktchase"),
              ("DANSER_BUILD_MODE", "TAKTCHASE_BUILD_MODE"),
              ("libdanser-core", "libtaktchase-core"),
              ("danser-core", "taktchase-core"),
              ("danser-cli", "taktchase-cli"),
          ]

          for path in paths:
              rel = path.as_posix()
              if rel in excluded or rel.startswith("assets/") or not path.is_file():
                  continue
              if path.suffix.lower() not in extensions and path.name not in extra_names:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)

              rebuilt = []
              for line in updated.splitlines(keepends=True):
                  if "assets/" not in line and "assets\\" not in line and not re.search(r"copyright", line, re.I):
                      line = line.replace("danser-go", "TaktChase")
                      line = line.replace("Danser", "TaktChase")
                      line = line.replace("danser", "taktchase")
                  rebuilt.append(line)
              updated = "".join(rebuilt)

              if rel == "dist-win.sh":
                  updated = updated.replace('          VALUE "CompanyName", "Wieku"', '          VALUE "CompanyName", "TaktChase contributors"')
                  updated = updated.replace('      VALUE "LegalCopyright", "Wieku 2018-2026"', '      VALUE "LegalCopyright", "Original work Copyright (C) Sebastian Krajewski 2018-2026"')
                  updated = updated.replace('2 ICON assets/textures/favicon.ico\n', '')
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="")
                  changed_files.append(rel)

          renamed_paths = []
          for path in tracked_paths():
              rel = path.as_posix()
              if rel.startswith("assets/") or rel in excluded or not path.exists():
                  continue
              new_rel = rel.replace("danser-go", "taktchase").replace("Danser", "TaktChase").replace("danser", "taktchase")
              if new_rel != rel:
                  target = Path(new_rel)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists():
                      raise RuntimeError(f"Refusing to overwrite existing path: {new_rel}")
                  path.rename(target)
                  renamed_paths.append((rel, new_rel))

          # Release workflow updates are handled separately via the GitHub API.

          print("Changed text files:")
          print("\n".join(f"  {p}" for p in sorted(set(changed_files))))
          print("Renamed paths:")
          print("\n".join(f"  {a} -> {b}" for a, b in renamed_paths))
          print(f"Summary: {len(set(changed_files))} changed text files; {len(renamed_paths)} renamed paths.")
          PY
          python /tmp/refactor_identity.py

      - name: Check patch whitespace and Go packages
        id: verify
        run: |
          set +e
          git diff --check
          whitespace_status=$?
          go test -vet=off ./...
          test_status=$?
          if [[ "$whitespace_status" -eq 0 && "$test_status" -eq 0 ]]; then
            echo "verification_status=0" >> "$GITHUB_ENV"
          else
            echo "verification_status=1" >> "$GITHUB_ENV"
          fi
          echo "Whitespace check exit: $whitespace_status"
          echo "Go test exit: $test_status"
          exit 0

      - name: Commit completed refactor back to branch
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "refactor: rename inherited project to TaktChase"
            git push origin "HEAD:$REF_NAME"
          fi

      - name: Report verification status
        if: always()
        run: |
          if [[ "${verification_status:-1}" != "0" ]]; then
            echo "::error::The refactor was committed, but verification needs follow-up."
            exit 1
          fi
