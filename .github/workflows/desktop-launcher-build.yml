name: Desktop launcher build check

on:
  push:
    branches:
      - "**"
    paths:
      - "launcher/**"
      - "app/settings/**"
      - "app/beatmap/**"
      - "app/database/**"
      - "go.mod"
      - "go.sum"
      - "dist-linux.sh"
      - "dist-win.sh"
      - ".github/workflows/desktop-launcher-build.yml"
  pull_request:
    branches:
      - master
    paths:
      - "launcher/**"
      - "app/settings/**"
      - "app/beatmap/**"
      - "app/database/**"
      - "go.mod"
      - "go.sum"
      - "dist-linux.sh"
      - "dist-win.sh"
      - ".github/workflows/desktop-launcher-build.yml"

permissions:
  contents: read

concurrency:
  group: desktop-launcher-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.2"

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip pkg-config \
            libx11-dev libx11-xcb-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev \
            libxkbcommon-x11-dev libxext-dev libxxf86vm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgtk-3-dev libasound2-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libvulkan-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify Go modules
        run: go mod verify
      - name: Build desktop package
        env:
          SKIP_FFMPEG: "1"
          GOMAXPROCS: "2"
          GOFLAGS: "-p=2"
        run: |
          ./dist-linux.sh 0.0.1
          test -s "dist/artifacts/taktchase-0.0.1-linux.zip"

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        uses: bwoodsend/setup-winlibs-action@v1
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Resolve Go modules
        run: |
          go get github.com/shntsk/taktchase/launcher
          git diff -- go.mod go.sum
      - name: Build desktop package
        env:
          SKIP_FFMPEG: "1"
        run: |
          ./dist-win.sh 0.0.1
          test -s "dist/artifacts/taktchase-0.0.1-win.zip"
